# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "rc-*" ]
  pull_request:
    branches: [ "main", "rc-*" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore NuGet packages
        run: dotnet restore Source\MoreInjuries\MoreInjuries.slnx
      - name: Ensure project builds in Release configuration
        run: dotnet build Source\MoreInjuries\MoreInjuries.slnx -c Release
      - name: Run unit tests
        run: dotnet test Source\MoreInjuries\MoreInjuries.slnx -c Test
