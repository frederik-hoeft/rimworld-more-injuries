# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "rc-*" ]
  pull_request:
    branches: [ "main", "rc-*" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore NuGet packages
        run: dotnet restore Source\MoreInjuries\MoreInjuries.slnx
      - name: Ensure project builds in Release configuration
        run: dotnet build Source\MoreInjuries\MoreInjuries.slnx -c Release --no-restore
      - name: Run unit tests
        run: dotnet test Source\MoreInjuries\MoreInjuries.slnx -c Test --no-restore
